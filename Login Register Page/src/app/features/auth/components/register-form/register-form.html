<form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Full Name</mat-label>
    <input matInput formControlName="fullName" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Email</mat-label>
    <input matInput type="email" formControlName="email" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Phone Number</mat-label>
    <input matInput type="tel" formControlName="phoneNumber" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Role</mat-label>
    <mat-select formControlName="role">
      <mat-option value="ngo">NGO</mat-option>
      <mat-option value="volunteer">Volunteer</mat-option>
      <mat-option value="administrator">Administrator</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Full Address</mat-label>
    <textarea matInput formControlName="address"></textarea>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>City</mat-label>
    <input matInput formControlName="city" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Pincode</mat-label>
    <input matInput formControlName="pincode" />
  </mat-form-field>

  <mat-checkbox formControlName="enableGps">Enable GPS Location</mat-checkbox>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Password</mat-label>
    <input matInput type="password" formControlName="password" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Confirm Password</mat-label>
    <input matInput type="password" formControlName="confirmPassword" />
  </mat-form-field>

  <mat-checkbox formControlName="terms">
    I agree to the Terms and Conditions
  </mat-checkbox>

  <button mat-raised-button color="primary" type="submit" [disabled]="registerForm.invalid">
    Register
  </button>
</form>
