<div class="profile-layout">
  <aside class="sidebar">
    <div class="logo">
      <h3>WasteZero</h3>
      <small>Admin</small>
    </div>
    <ul class="menu">
      <li><a routerLink="/dashboard">📊 Dashboard</a></li>
      <li><a routerLink="/schedule">🚚 Schedule Pickup</a></li>
      <li><a routerLink="/opportunities">💡 Volunteer Opportunities</a></li>
      <li><a routerLink="/messages">✉️ Inbox</a></li>
      <li><a routerLink="/impact">🌍 My Impact Score</a></li>
    </ul>
    <div class="settings">
      <a routerLink="/profile">⚙️ Profile Settings</a>
      <a routerLink="/settings">🔧 App Preferences</a>
      <a routerLink="/help">❓ Help & Support</a>
      <a routerLink="/admin">🛠️ Admin Panel</a>
    </div>

    <div class="theme-toggle">
      <button (click)="toggleTheme()">
        {{ isDarkTheme ? '🌙 Dark Mode' : '☀️ Light Mode' }}
      </button>
    </div>
  </aside>

  <main class="content">
    <div class="profile-container">
      <h2>Profile Settings</h2>

      <ul class="nav nav-tabs">
        <li class="nav-item">
          <a class="nav-link" [class.active]="activeTab==='profile'" (click)="setActiveTab('profile')">Update Profile</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" [class.active]="activeTab==='password'" (click)="setActiveTab('password')">Change Password</a>
        </li>
      </ul>

      <div class="tab-content p-3">
        <div *ngIf="activeTab==='profile'">
          <form [formGroup]="profileForm" (ngSubmit)="saveProfile()">
            <div class="form-group">
              <label>Full Name</label>
              <input class="form-control" formControlName="fullName" placeholder="Enter full name">
            </div>
            <div class="form-group">
              <label>Email (for notifications)</label>
              <input class="form-control" formControlName="email" readonly>
            </div>
            <div class="form-group">
              <label>Location</label>
              <input class="form-control" formControlName="location" placeholder="Enter location">
            </div>
            <div class="form-group">
              <label>Skills/Interests</label>
              <input class="form-control" formControlName="skills" placeholder="e.g. Angular, Node.js, Recycling, Volunteering">
            </div>
            <button class="btn btn-primary" type="submit">Save Changes</button>
          </form>
        </div>

        <div *ngIf="activeTab==='password'">
          <form [formGroup]="passwordForm" (ngSubmit)="changePassword()">
            <div class="form-group">
              <label>Current Password</label>
              <input type="password" class="form-control" formControlName="currentPassword">
            </div>
            <div class="form-group">
              <label>New Password</label>
              <input type="password" class="form-control" formControlName="newPassword">
            </div>
            <div class="form-group">
              <label>Confirm New Password</label>
              <input type="password" class="form-control" formControlName="confirmPassword">
            </div>
            <button class="btn btn-warning" type="submit">Change Password</button>
          </form>
        </div>

        <div *ngIf="successMessage" class="alert alert-success mt-3">{{successMessage}}</div>
        <div *ngIf="errorMessage" class="alert alert-danger mt-3">{{errorMessage}}</div>
      </div>
    </div>
  </main>
</div>
