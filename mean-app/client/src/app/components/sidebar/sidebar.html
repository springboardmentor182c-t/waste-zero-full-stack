<div class="sidebar" [class.dark]="darkMode">
  <!-- Scrollable Content -->
  <div class="sidebar-content">
    <!-- Logo -->
    <div class="logo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M19 3H5C3.89543 3 3 3.89543 3 5V19C3 20.1046 3.89543 21 5 21H19C20.1046 21 21 20.1046 21 19V5C21 3.89543 20.1046 3 19 3Z" stroke="currentColor" stroke-width="2"/>
        <path d="M12 8V16M8 12H16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span>WasteZero</span>
    </div>

    <!-- User Profile -->
    <div class="user-profile">
      <div class="avatar">A</div>
      <div class="user-info">
        <div class="user-name">Admin User</div>
        <div class="user-role">Admin</div>
      </div>
    </div>

    <!-- Main Menu -->
    <div class="menu-section">
      <div class="menu-label">MAIN MENU</div>
      <div class="menu-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="3" width="7" height="7" stroke="currentColor" stroke-width="2"/>
          <rect x="14" y="3" width="7" height="7" stroke="currentColor" stroke-width="2"/>
          <rect x="3" y="14" width="7" height="7" stroke="currentColor" stroke-width="2"/>
          <rect x="14" y="14" width="7" height="7" stroke="currentColor" stroke-width="2"/>
        </svg>
        <span>Dashboard</span>
      </div>
      <div class="menu-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="2"/>
          <path d="M8 2V6M16 2V6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span>Schedule Pickup</span>
      </div>
      <div class="menu-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M21 11.5C21 16.75 12 22 12 22S3 16.75 3 11.5C3 5.5 7 2 12 2S21 5.5 21 11.5Z" stroke="currentColor" stroke-width="2"/>
        </svg>
        <span>Opportunities</span>
      </div>
      <div class="menu-item active">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="2"/>
          <path d="M3 9H21" stroke="currentColor" stroke-width="2"/>
        </svg>
        <span>Messages</span>
      </div>
      <div class="menu-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" stroke="currentColor" stroke-width="2"/>
          <path d="M12 8V12L15 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span>My Impact</span>
      </div>
    </div>

    <!-- Settings -->
    <div class="menu-section">
      <div class="menu-label">SETTINGS</div>
      <div class="menu-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
          <path d="M12 2C13 2 14 3 14 4V5C14 6 13 7 12 7C11 7 10 6 10 5V4C10 3 11 2 12 2Z" stroke="currentColor" stroke-width="2"/>
        </svg>
        <span>My Profile</span>
      </div>
      <div class="menu-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
          <path d="M19.4 15C19.3 15.6 19.1 16.2 18.8 16.7L20.5 18.4L18.4 20.5L16.7 18.8C16.2 19.1 15.6 19.3 15 19.4V22H13V19.4C12.4 19.3 11.8 19.1 11.3 18.8L9.6 20.5L7.5 18.4L9.2 16.7C8.9 16.2 8.7 15.6 8.6 15H6V13H8.6C8.7 12.4 8.9 11.8 9.2 11.3L7.5 9.6L9.6 7.5L11.3 9.2C11.8 8.9 12.4 8.7 13 8.6V6H15V8.6C15.6 8.7 16.2 8.9 16.7 9.2L18.4 7.5L20.5 9.6L18.8 11.3C19.1 11.8 19.3 12.4 19.4 13H22V15H19.4Z" stroke="currentColor" stroke-width="2"/>
        </svg>
        <span>Settings</span>
      </div>
      <div class="menu-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
          <path d="M12 16V12M12 8H12.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span>Help & Support</span>
      </div>
      <div class="menu-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2"/>
          <path d="M9 3V21M15 3V21" stroke="currentColor" stroke-width="2"/>
        </svg>
        <span>Admin Panel</span>
      </div>
    </div>
  </div>

  <!-- Fixed Dark Mode Toggle -->
  <div class="dark-mode-toggle">
    <span>Dark Mode</span>
    <label class="switch">
      <input type="checkbox" [checked]="darkMode" (change)="toggleDarkMode()">
      <span class="slider"></span>
    </label>
  </div>
</div>
