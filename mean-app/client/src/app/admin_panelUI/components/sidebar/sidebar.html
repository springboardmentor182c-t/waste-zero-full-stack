<div class="sidebar">
  <!-- Logo Section -->
  <div class="logo-section">
    <mat-icon class="logo-icon">recycling</mat-icon>
    <span class="logo-text">WasteZero</span>
  </div>

  <!-- User Info -->
  <div class="user-info">
    <div class="user-avatar">V</div>
    <span class="user-name">venu</span>
  </div>

  <!-- Main Menu -->
  <div class="menu-section">
    <h3 class="menu-title">MAIN MENU</h3>
    <mat-nav-list>
      <mat-list-item 
        *ngFor="let item of menuItems" 
        [class.active]="selectedMenu === item.id"
        (click)="selectMenu(item.id)">
        <mat-icon matListItemIcon>{{item.icon}}</mat-icon>
        <span matListItemTitle>{{item.label}}</span>
      </mat-list-item>
    </mat-nav-list>
  </div>

  <!-- Settings Section -->
  <div class="menu-section">
    <h3 class="menu-title">SETTINGS</h3>
    <mat-nav-list>
      <mat-list-item 
        *ngFor="let item of settingsItems" 
        [class.active]="selectedMenu === item.id"
        (click)="selectMenu(item.id)">
        <mat-icon matListItemIcon>{{item.icon}}</mat-icon>
        <span matListItemTitle>{{item.label}}</span>
      </mat-list-item>
    </mat-nav-list>
  </div>

  <!-- Dark Mode Toggle -->
  <div class="dark-mode-toggle">
    <span>Dark Mode</span>
    <mat-slide-toggle [(ngModel)]="darkMode" (change)="toggleDarkMode()"></mat-slide-toggle>
  </div>
</div>
