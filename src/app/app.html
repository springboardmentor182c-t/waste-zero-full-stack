<header
  class="sticky top-0 z-40 bg-white/80 dark:bg-neutral-950/80 backdrop-blur border-b border-slate-200/70 dark:border-neutral-800"
>
  <div class="container-page h-16 flex items-center justify-between">
    <a class="flex items-center gap-2 font-semibold text-lg" routerLink="/">
      <span
        class="inline-flex h-8 w-8 items-center justify-center rounded-lg bg-primary/10 text-primary"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          class="h-5 w-5"
        >
          <path
            d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5Z"
          />
        </svg>
      </span>
      WasteZero
    </a>
    <nav class="hidden md:flex items-center gap-6 text-sm">
      <a
        routerLink="/"
        routerLinkActive="text-primary"
        [routerLinkActiveOptions]="{ exact: true }"
        class="hover:text-primary transition-colors"
        >Home</a
      >
      <a
        routerLink="/login"
        routerLinkActive="text-primary"
        class="hover:text-primary transition-colors"
        >Login</a
      >
      <a
        routerLink="/register"
        routerLinkActive="text-primary"
        class="hover:text-primary transition-colors"
        >Register</a
      >
      <a
        routerLink="/profile"
        routerLinkActive="text-primary"
        class="hover:text-primary transition-colors"
        >Profile</a
      >
      <button
        type="button"
        class="ml-2 p-2 rounded-lg border border-slate-200 dark:border-neutral-800 hover:bg-slate-100 dark:hover:bg-neutral-800"
        (click)="toggleDark()"
        aria-label="Toggle theme"
      >
        <svg
          *ngIf="!isDark()"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          class="h-5 w-5"
        >
          <path
            d="M12 3a1 1 0 0 1 1 1v1a1 1 0 1 1-2 0V4a1 1 0 0 1 1-1Zm0 15a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm7-6a1 1 0 0 1 1 1 1 1 0 1 1-2 0 1 1 0 0 1 1-1ZM5 12a1 1 0 1 1-2 0 1 1 0 0 1 2 0Zm1.64 6.36a1 1 0 1 1 1.41 1.41 1 1 0 0 1-1.41-1.41ZM17 6.64a1 1 0 1 1 1.41-1.41A1 1 0 0 1 17 6.64ZM4.93 5.64A1 1 0 1 1 6.34 4.22 1 1 0 0 1 4.93 5.64ZM18.36 18.36a1 1 0 1 1 1.41-1.41 1 1 0 0 1-1.41 1.41Z"
          />
        </svg>
        <svg
          *ngIf="isDark()"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          class="h-5 w-5"
        >
          <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 1 0 9.79 9.79Z" />
        </svg>
      </button>
    </nav>
  </div>
</header>
<main class="container-page py-10">
  <router-outlet></router-outlet>
</main>
